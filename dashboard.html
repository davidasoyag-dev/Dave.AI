<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dave.AI — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#090e1c;--navy2:#0f1729;--card:#121d35;--card2:#162040;--card3:#1a2848;
  --blue:#4f72c4;--blue2:#7aaaf8;--blue3:rgba(79,114,196,0.15);
  --border:rgba(79,114,196,0.18);--border2:rgba(79,114,196,0.32);
  --text:#eef2ff;--muted:rgba(200,216,255,0.55);--dim:rgba(200,216,255,0.28);
  --green:#3cb464;--red:#e05a50;--amber:#c8963c;
  --sidebar:220px;--topbar:56px;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Syne',sans-serif;
}
html,body{height:100%;font-family:var(--sans);background:var(--navy);color:var(--text);overflow:hidden;}
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--topbar) 1fr;height:100vh;}
.topbar{grid-column:1/-1;background:var(--navy2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px 0 0;z-index:100;}
.tb-logo{width:var(--sidebar);flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 20px;border-right:1px solid var(--border);height:100%;}
.tb-logo-icon{width:30px;height:30px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(79,114,196,0.4);flex-shrink:0;}
.tb-logo-name{font-family:var(--display);font-size:16px;font-weight:700;}
.tb-logo-name em{color:var(--blue2);font-style:normal;}
.tb-center{flex:1;padding:0 20px;}
.tb-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:7px 13px;width:280px;}
.tb-search input{background:none;border:none;outline:none;color:var(--text);font-size:12px;font-family:var(--sans);width:100%;}
.tb-search input::placeholder{color:var(--dim);}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.tb-plan-badge{background:rgba(79,114,196,0.12);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;font-size:10px;font-weight:600;color:var(--blue2);letter-spacing:.04em;}
.tb-avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3d60b8,#4f72c4);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;border:1.5px solid var(--border2);}
.sidebar{background:var(--navy2);border-right:1px solid var(--border);padding:16px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.sb-section{font-size:9px;font-weight:600;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:10px 10px 6px;margin-top:6px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;color:var(--muted);position:relative;}
.sb-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.sb-item.active{background:rgba(79,114,196,0.15);color:var(--text);}
.sb-item.active::before{content:'';position:absolute;left:0;top:20%;height:60%;width:3px;background:var(--blue2);border-radius:0 3px 3px 0;}
.sb-icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.sb-badge{margin-left:auto;background:var(--blue);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;}
.sb-divider{height:1px;background:var(--border);margin:8px 4px;}
.sb-bottom{margin-top:auto;}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,0.02);}
.sb-user-av{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#3d60b8,#4f72c4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.sb-user-name{font-size:12px;font-weight:600;}
.sb-user-plan{font-size:10px;color:var(--muted);}
.main{overflow-y:auto;background:var(--navy);}
.view{padding:28px 32px;min-height:100%;animation:viewIn .2s ease both;}
@keyframes viewIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.view-title{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;}
.view-sub{font-size:12px;color:var(--muted);margin-bottom:24px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
.stat-label{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-bottom:8px;}
.stat-val{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1;}
.stat-sub{font-size:11px;color:var(--muted);margin-top:6px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;}
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.qa-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:all .2s;text-align:center;}
.qa-card:hover{border-color:var(--border2);background:var(--card2);transform:translateY(-2px);}
.qa-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.qa-label{font-size:12px;font-weight:600;}
.qa-desc{font-size:10px;color:var(--muted);margin-top:3px;}
.btn{padding:9px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .15s;border:none;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:#3d60b8;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}
.inp{width:100%;padding:10px 13px;background:rgba(255,255,255,0.04);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none;transition:all .2s;}
.inp:focus{border-color:var(--blue2);background:rgba(79,114,196,0.06);}
.inp::placeholder{color:var(--dim);}
textarea.inp{resize:vertical;line-height:1.6;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.ai-out{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:18px;font-family:var(--mono);font-size:12px;color:rgba(200,216,255,0.85);line-height:1.75;white-space:pre-wrap;min-height:200px;max-height:400px;overflow-y:auto;}
.typing{display:flex;align-items:center;gap:5px;padding:14px 0;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--blue2);animation:bounce .9s infinite;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-6px);}}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 0;}
.msg-user{align-self:flex-end;max-width:75%;background:var(--blue);color:#fff;padding:10px 14px;border-radius:12px 12px 3px 12px;font-size:13px;line-height:1.55;}
.msg-ai{align-self:flex-start;max-width:85%;background:var(--card2);border:1px solid var(--border);padding:12px 14px;border-radius:12px 12px 12px 3px;font-size:12px;line-height:1.7;color:rgba(200,216,255,0.9);font-family:var(--mono);}
.msg-ai-label{font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--blue2);margin-bottom:6px;}
.chat-inp{flex:1;padding:11px 14px;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none;transition:border .2s;}
.chat-inp:focus{border-color:var(--blue2);}
.upload-zone{border:2px dashed var(--border);border-radius:14px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;}
.upload-zone:hover{border-color:var(--blue2);background:rgba(79,114,196,0.05);}
.risk-item{border-radius:9px;padding:12px 14px;margin-bottom:8px;border-left:3px solid;}
.risk-high{background:rgba(224,90,80,0.08);border-color:#e05a50;}
.risk-medium{background:rgba(200,150,60,0.08);border-color:#c8963c;}
.risk-low{background:rgba(60,180,100,0.08);border-color:#3cb464;}
.risk-title{font-size:12px;font-weight:600;margin-bottom:3px;}
.risk-detail{font-size:11px;color:var(--muted);line-height:1.5;}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;}
.tag-blue{background:rgba(79,114,196,0.15);color:var(--blue2);border:1px solid rgba(79,114,196,0.25);}
.tag-green{background:rgba(60,180,100,0.12);color:#3cb464;border:1px solid rgba(60,180,100,0.22);}
.tag-red{background:rgba(224,90,80,0.12);color:#e05a50;border:1px solid rgba(224,90,80,0.22);}
.doc-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;transition:background .15s;border:1px solid transparent;}
.doc-row:hover{background:var(--card2);border-color:var(--border);}
.doc-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.doc-name{font-size:13px;font-weight:500;}
.doc-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.empty{text-align:center;padding:48px 20px;}
.empty-icon{width:52px;height:52px;border-radius:14px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.empty-title{font-size:14px;font-weight:600;margin-bottom:6px;}
.empty-sub{font-size:12px;color:var(--muted);line-height:1.6;max-width:280px;margin:0 auto 18px;}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab{padding:9px 16px;font-size:12px;font-weight:500;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--sans);transition:all .15s;margin-bottom:-1px;}
.tab.on{color:var(--text);border-bottom-color:var(--blue2);}
.plan-card-ui{border:1.5px solid var(--border);border-radius:14px;padding:20px;transition:all .2s;}
.plan-card-ui.current{border-color:var(--blue2);background:rgba(79,114,196,0.08);}
.plan-name-ui{font-family:var(--display);font-size:15px;font-weight:700;margin-bottom:4px;}
.plan-price-ui{font-family:var(--display);font-size:26px;font-weight:800;color:var(--blue2);}
.plan-price-ui sub{font-size:12px;font-weight:500;color:var(--muted);}
.plan-feat-ui{font-size:11px;color:var(--muted);margin-top:12px;display:flex;flex-direction:column;gap:5px;}
.plan-feat-ui li{list-style:none;display:flex;align-items:center;gap:6px;}
.plan-feat-ui li::before{content:'✓';color:var(--green);font-size:10px;font-weight:700;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-label{font-size:13px;font-weight:500;}
.settings-desc{font-size:11px;color:var(--muted);margin-top:2px;}
.toggle{width:38px;height:22px;border-radius:11px;background:var(--border2);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--blue);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;}
.toggle.on::after{transform:translateX(16px);}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(79,114,196,0.25);border-radius:5px;}
/* Welcome banner */
.welcome-banner{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#162040,#1a2848);border:1px solid rgba(79,114,196,0.4);color:#eef2ff;padding:16px 28px;border-radius:14px;z-index:9999;font-family:var(--sans);box-shadow:0 8px 32px rgba(0,0,0,0.5);text-align:center;min-width:300px;animation:bannerIn .4s cubic-bezier(.22,1,.36,1) both;}
@keyframes bannerIn{from{opacity:0;transform:translateX(-50%) translateY(-20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.welcome-banner h3{font-family:var(--display);font-size:16px;font-weight:700;margin-bottom:4px;}
.welcome-banner h3 em{color:var(--blue2);font-style:normal;}
.welcome-banner p{font-size:12px;color:rgba(200,216,255,0.6);}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="tb-logo">
      <div class="tb-logo-icon">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><rect x="4" y="3" width="2.5" height="18" rx=".5" fill="white"/><rect x="4" y="3" width="8" height="2.5" rx=".5" fill="white"/><rect x="4" y="18.5" width="8" height="2.5" rx=".5" fill="white"/><path d="M12 3.5Q20.5 4 20.5 12Q20.5 20 12 20.5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </div>
      <span class="tb-logo-name">Dave<em>.AI</em></span>
    </div>
    <div class="tb-center">
      <div class="tb-search">
        <svg width="13" height="13" fill="none" stroke="rgba(200,216,255,0.3)" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search documents, research..."/>
      </div>
    </div>
    <div class="tb-right">
      <div class="tb-plan-badge" id="tb-plan-badge">PRO PLAN</div>
      <div class="tb-avatar" id="tb-avatar">DA</div>
    </div>
  </header>

  <nav class="sidebar">
    <div class="sb-section">Main</div>
    <div class="sb-item active" onclick="nav('dashboard')" id="nav-dashboard">
      <div class="sb-icon"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></div>
      Dashboard
    </div>
    <div class="sb-section">Tools</div>
    <div class="sb-item" onclick="nav('draft')" id="nav-draft">
      <div class="sb-icon"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
      Draft
    </div>
    <div class="sb-item" onclick="nav('review')" id="nav-review">
      <div class="sb-icon"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
      Review
    </div>
    <div class="sb-item" onclick="nav('research')" id="nav-research">
      <div class="sb-icon"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      Research
    </div>
    <div class="sb-section">Workspace</div>
    <div class="sb-item" onclick="nav('history')" id="nav-history">
      <div class="sb-icon"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
      History
      <span class="sb-badge" id="doc-count">0</span>
    </div>
    <div class="sb-item" onclick="nav('settings')" id="nav-settings">
      <div class="sb-icon"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
      Settings
    </div>
    <div class="sb-divider"></div>
    <div class="sb-bottom">
      <div class="sb-item" onclick="nav('billing')" id="nav-billing">
        <div class="sb-icon"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div>
        Billing
      </div>
      <div class="sb-user" style="margin-top:8px">
        <div class="sb-user-av" id="sb-av">DA</div>
        <div>
          <div class="sb-user-name" id="sb-name">David Asoyag</div>
          <div class="sb-user-plan" id="sb-plan">Pro Plan · Active</div>
        </div>
      </div>
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>

<script>
// ── Load session ──
var S = JSON.parse(localStorage.getItem('dave_session') || '{}');

// Redirect to login if no session
if(!S.plan){
  window.location.href = 'index.html';
}

var firstName  = S.firstName  || 'David';
var lastName   = S.lastName   || 'Asoyag';
var fullName   = (firstName + ' ' + lastName).trim();
var initials   = (firstName[0]||'D').toUpperCase() + (lastName[0]||'A').toUpperCase();
var email      = S.email      || '';
var firm       = S.firm       || '';
var plan       = S.plan       || 'pro';
var planName   = S.planName   || 'Pro Plan';
var planPrice  = S.planPrice  || '£149/mo';
var planUsers  = S.planUsers  || 'up to 5 users';
var trialStart = S.trialStart ? new Date(S.trialStart) : new Date();
var trialEnd   = new Date(trialStart); trialEnd.setDate(trialEnd.getDate()+14);
var trialDaysLeft = Math.max(0, Math.ceil((trialEnd - new Date()) / 86400000));
var trialEndStr = trialEnd.toLocaleDateString('en-GB',{day:'numeric',month:'long'});

// ── Set UI elements ──
document.getElementById('tb-avatar').textContent = initials;
document.getElementById('tb-avatar').title = fullName;
document.getElementById('sb-av').textContent = initials;
document.getElementById('sb-name').textContent = fullName;
document.getElementById('sb-plan').textContent = planName + (S.planActive ? ' · Active' : ' · Trial');
document.getElementById('tb-plan-badge').textContent = plan.toUpperCase() + (S.planActive ? ' · ACTIVE' : ' · TRIAL');

// ── Docs ──
var docs = JSON.parse(localStorage.getItem('dave_docs_'+plan) || '[]');
function saveDocs(){ localStorage.setItem('dave_docs_'+plan, JSON.stringify(docs)); document.getElementById('doc-count').textContent = docs.length; }
document.getElementById('doc-count').textContent = docs.length;

// ── Navigation ──
var currentView = 'dashboard';
function nav(view){
  currentView = view;
  document.querySelectorAll('.sb-item').forEach(function(el){ el.classList.remove('active'); });
  var navEl = document.getElementById('nav-'+view);
  if(navEl) navEl.classList.add('active');
  render(view);
}

function render(view){
  var m = document.getElementById('main');
  if(view==='dashboard') m.innerHTML = viewDashboard();
  else if(view==='draft') m.innerHTML = viewDraft();
  else if(view==='review') m.innerHTML = viewReview();
  else if(view==='research'){ m.innerHTML = viewResearch(); renderChat(); }
  else if(view==='history') m.innerHTML = viewHistory();
  else if(view==='settings') m.innerHTML = viewSettings();
  else if(view==='billing') m.innerHTML = viewBilling();
}

// ── Claude API ──
async function callClaude(system, user){
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:system,messages:[{role:'user',content:user}]})
  });

}

async function doDraft(){
  var type=document.getElementById('draft-type').value;
  var prompt=document.getElementById('draft-prompt').value.trim();
  if(!prompt){alert('Please describe your requirements.');return;}
  var btn=document.getElementById('draft-btn');
  btn.disabled=true;btn.textContent='Generating...';
  document.getElementById('draft-out').innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  try{
    var r=await callClaude('You are a senior UK solicitor. Draft professional, legally precise documents governed by English law. Use proper clause numbering, clear headings, and full legal boilerplate. Include a signature block. End with: "AI-generated draft — review with a qualified solicitor before use."','Draft a '+type+' for: '+prompt);
    document.getElementById('draft-out').textContent=r;
    document.getElementById('draft-actions').style.display='flex';
    window._lastDraft={name:type+' — '+new Date().toLocaleDateString('en-GB'),type:'Draft',date:new Date().toLocaleDateString('en-GB'),content:r};
  }catch(e){document.getElementById('draft-out').textContent='Error: '+e.message;}

}
function saveDraftDoc(){if(!window._lastDraft)return;docs.unshift(window._lastDraft);saveDocs();var b=document.getElementById('save-draft-btn');b.textContent='&#x2713; Saved!';b.disabled=true;}
function copyDraft(){navigator.clipboard.writeText(document.getElementById('draft-out').textContent);}
function downloadDraft(){var blob=new Blob([document.getElementById('draft-out').textContent],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='document.txt';a.click();}
function clearDraft(){document.getElementById('draft-prompt').value='';document.getElementById('draft-out').innerHTML='<div style="color:var(--dim);font-size:12px;text-align:center;padding-top:60px;font-family:var(--sans)">Your drafted document will appear here.</div>';document.getElementById('draft-actions').style.display='none';}

    ${!S.planActive?`<div class="card" style="margin-bottom:20px;background:rgba(200,150,60,0.06);border-color:rgba(200,150,60,0.3)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div><div style="font-size:13px;font-weight:600;color:#c8963c;margin-bottom:3px">Trial ending soon</div><div style="font-size:12px;color:var(--muted)">Your trial ends in ${trialDaysLeft} days. Add a payment method to continue.</div></div>
        <button class="btn btn-primary" style="flex-shrink:0;margin-left:20px" onclick="doStripeCheckout('${plan}')">Add payment method</button>
      </div>
    </div>`:''}
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px">
      ${[['starter','Starter','£49',['1 user','Contract drafting','Document review','Legal research','20 docs/month']],['pro','Pro','£149',['Up to 5 users','Everything in Starter','Unlimited documents','Priority support']],['firm','Firm','£299',['Up to 10 users','Everything in Pro','Team analytics','Custom templates']],['enterprise','Enterprise','Custom',['10+ users','Everything in Firm','API access','White-labelling']]].map(function(p){var isCurrent=plan===p[0];return`<div class="plan-card-ui ${isCurrent?'current':''}"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><div class="plan-name-ui">${p[1]}</div>${isCurrent?'<span class="tag tag-blue">Current</span>':''}</div><div class="plan-price-ui">${p[2]}${p[2]!=='Custom'?'<sub>/mo</sub>':''}</div><ul class="plan-feat-ui">${p[3].map(function(f){return`<li>${f}</li>`;}).join('')}</ul><button class="btn ${isCurrent?'btn-primary':'btn-ghost'}" style="width:100%;margin-top:14px" onclick="doStripeCheckout('${p[0]}')">${isCurrent?(S.planActive?'Active':'Activate plan'):'Select plan'}</button></div>`;}).join('')}
    </div>
    <div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:16px">Billing history</div><div style="text-align:center;padding:24px;color:var(--muted);font-size:12px">No billing history yet</div></div>
  </div>`;
}

function doStripeCheckout(planKey){
  var btn = event && event.target ? event.target : null;
  if(btn){ btn.disabled=true; btn.textContent='Redirecting...'; }
  fetch('/.netlify/functions/create-checkout',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plan:planKey,email:email,firstName:firstName,lastName:lastName,firm:firm})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.url) window.location.href=d.url;
    else{ alert('Error: '+(d.error||'Could not connect')); if(btn){btn.disabled=false;btn.textContent='Activate plan';} }
  })
  .catch(function(e){
    alert('Could not connect. Please try again.');
    if(btn){btn.disabled=false;btn.textContent='Activate plan';}
  });
}

// ── Show welcome banner if just signed in ──
(function(){
  if(localStorage.getItem('dave_show_welcome')==='1'){
    localStorage.removeItem('dave_show_welcome');
    setTimeout(function(){
      var b=document.createElement('div');
      b.className='welcome-banner';
      b.innerHTML='<h3>Welcome to Dave<em>.AI</em>, '+firstName+'!</h3><p>Please enjoy your experience</p>';
      document.body.appendChild(b);
      setTimeout(function(){b.style.transition='opacity 0.5s';b.style.opacity='0';setTimeout(function(){b.remove();},500);},5000);
    },400);
  }
})();

// ── Init ──
render('dashboard');
</script>
</body>
</html>
